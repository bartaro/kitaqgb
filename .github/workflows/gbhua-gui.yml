name: GBHUA GUI
on:
  push:
    paths:
      - 'tools/gbhua/**'
      - '!tools/gbhua/bin/**'
      - '.github/workflows/gbhua-gui.yml'
  pull_request:
    paths:
      - 'tools/gbhua/**'
      - '!tools/gbhua/bin/**'
      - '.github/workflows/gbhua-gui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: gbhua_gui.exe
            label: windows-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            binary: gbhua_gui
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: gbhua_gui
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        working-directory: tools/gbhua
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: GUI event, layout, clipboard, save and image tests
        run: cargo test --release --locked -p gbhua --features gui --target ${{ matrix.target }}
      - name: Build native GUI
        run: cargo build --release --locked -p gbhua --features gui --bin gbhua_gui --target ${{ matrix.target }}
      - name: Python binding build and round trip
        run: |
          python -m pip install 'maturin>=1.8,<2'
          python -m maturin build --release --locked --features python --out wheels
          python scripts/test_python.py wheels
      - name: Package application, fonts, nine manuals and native license closure
        run: >-
          python scripts/package_gui.py
          --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
          --target ${{ matrix.target }}
          --source-commit ${{ github.sha }} --out dist-gui
      - uses: actions/upload-artifact@v4
        with:
          name: gbhua-gui-${{ matrix.label }}
          retention-days: 30
          if-no-files-found: error
          path: tools/gbhua/dist-gui/*
