[package]
name = "plita_render"
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["plita UI Contributors"]
description = "GPU renderer foundation for plita UI Phase 1."

[dependencies]
plita_ui = { path = "../plita_ui" }
bytemuck = { version = "1.25", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "dx12", "gles", "vulkan", "wgsl", "metal"] }
winit = "0.30.13"
vello = { version = "0.8.0", default-features = false, features = ["wgpu"] }
[dev-dependencies]
pollster = "0.4"
serde_json = "1.0"
