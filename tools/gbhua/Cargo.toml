[workspace]
resolver = "2"
members = ["vendor/plita/crates/*"]
default-members = ["."]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["PLITA UI Contributors"]

[workspace.dependencies]
plita_app = { path = "vendor/plita/crates/plita_app" }
plita_window = { path = "vendor/plita/crates/plita_window" }
plita_render = { path = "vendor/plita/crates/plita_render" }
plita_ui = { path = "vendor/plita/crates/plita_ui" }
thiserror = "2.0"
bytemuck = { version = "1.25", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
pollster = "0.4"
pyo3 = { version = "0.21", features = ["abi3-py310", "extension-module"] }
winit = "0.30.13"
wgpu = { version = "28.0.0", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
vello = { version = "0.8.0", default-features = false, features = ["wgpu"] }

[package]
name = "gbhua"
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["DAISUKE OBA"]
description = "GBHUA: Game Boy tile and map editor, CLI and Python bindings"
default-run = "gbhua"
autobins = false

[lib]
name = "gbhua_lib"
crate-type = ["rlib", "cdylib"]

[features]
default = []
gui = ["dep:plita", "dep:arboard", "dep:rfd"]
gui-console = ["gui"]
python = ["gui", "plita/python", "dep:pyo3"]

[[bin]]
name = "gbhua_gui"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "gbhua"
path = "src/bin/gbhua.rs"

[dependencies]
arboard = { version = "3.6", optional = true }
plita = { path = "vendor/plita/crates/plita", optional = true }
pyo3 = { workspace = true, optional = true }
rfd = { version = "0.17", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
strip = "debuginfo"
