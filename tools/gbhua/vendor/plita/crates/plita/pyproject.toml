[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "plita"
version = "0.0.1"
description = "Python helper bindings for PLITA UI applications."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PLITA UI Contributors" }]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "plita"
